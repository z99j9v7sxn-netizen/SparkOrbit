server {
  listen 443 ssl;
  server_name wikj.online www.wikj.online;

  ssl_certificate     /etc/nginx/certs/wikj.online_bundle.crt;
  ssl_certificate_key /etc/nginx/certs/wikj.online.key;
  ssl_session_timeout 5m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  # Vite 打包的 pdf.worker 等 ES module
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # 教材 PDF 由 nginx 直出（绕过 Python），支持 Range + 浏览器缓存
  location /static/materials/ {
    alias /materials/;
    sendfile on;
    tcp_nopush on;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, max-age=604800";
  }

  # 学生上传（星库 PDF 等）同样由 nginx 直出，Range 不再经过 Python
  location /static/uploads/ {
    alias /uploads/;
    sendfile on;
    tcp_nopush on;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, max-age=86400";
  }

  location /static/ {
    proxy_pass http://backend:8000/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name wikj.online www.wikj.online _;
  return 301 https://wikj.online$request_uri;
}
