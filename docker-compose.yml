services:
  mysql:
    image: mysql:8.0
    container_name: sparkorbit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sparkorbit}
      MYSQL_DATABASE: sparkorbit
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-sparkorbit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkorbit-backend
    restart: unless-stopped
    # 根 .env + backend/.env 注入全部 API Key；下方 environment 覆盖本地 127.0.0.1 的 DATABASE_URL
    env_file:
      - .env
      - backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-sparkorbit}@mysql:3306/sparkorbit?charset=utf8mb4
      CODELAB_RUNNER_URL: ${CODELAB_RUNNER_URL:-http://codelab-runner:8091}
    volumes:
      # 项目根 资料/ → 容器 /资料（paths.MATERIALS_DIR）
      - ./资料:/资料:ro
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
      - ./backend/vaults:/app/vaults
      - ./backend/app/static/media/generated:/app/app/static/media/generated
    depends_on:
      mysql:
        condition: service_healthy
      codelab-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sparkorbit-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./资料:/materials:ro
      - ./backend/uploads:/uploads:ro
    depends_on:
      backend:
        condition: service_healthy

  # 代码舱执行 sidecar（随主栈启动；失败时 backend 回退 subprocess）
  # 硬限额：mem/cpu/pids；只读根 + tmpfs；仅 compose 内网 expose（无公网端口）
  codelab-runner:
    image: python:3.12-slim
    container_name: sparkorbit-codelab-runner
    restart: unless-stopped
    working_dir: /app
    command: ["python", "scripts/codelab_runner_server.py"]
    volumes:
      - ./scripts/codelab_runner_server.py:/app/scripts/codelab_runner_server.py:ro
    expose:
      - "8091"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
