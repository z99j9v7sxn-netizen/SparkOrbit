# Alembic — SparkOrbit
# 用法（在 backend/ 目录）:
#   alembic upgrade head
#   alembic revision -m "描述"
# 已有库首次接入: alembic stamp head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 由 env.py 从 Settings.database_url 覆盖；此处仅占位
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
