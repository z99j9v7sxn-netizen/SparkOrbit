name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_smoke.db
          JWT_SECRET: ci-test-secret
        run: python -m pytest tests/test_jwt_auth.py tests/test_track_b_teaching.py tests/test_orchestration_plans.py -q
      - name: Alembic heads
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_alembic.db
        run: python -m alembic heads

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  harness-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local harness report
        run: python scripts/generate_local_harness_report.py
      - name: Assert non-placeholder
        run: |
          grep -vq "Placeholder" docs/evidence/better-harness/report.md
          test -f docs/evidence/better-harness/findings.json
